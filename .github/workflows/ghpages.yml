name: Build and publish MkDocs
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs/**
      - .github/workflows/ghpages.yml
  pull_request:
    paths:
      - mkdocs/**
      - .github/workflows/ghpages.yml
  workflow_dispatch:
concurrency:
  group: publish-mkdocs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-mkdocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MkDocs dependencies
        run: pip install -r mkdocs/requirements.txt -r mkdocs/requirements-pdf.txt
      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core
#      - name: Prepare docs files
#        run: python mkdocs/prepare_docs.py
      - name: Commit docs changes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "chore: update docs files"
            git push
          fi
      - name: Build MkDocs
        working-directory: mkdocs
        run: mkdocs build --config-file mkdocs.yml
      - name: Generate PDF books
        run: python mkdocs/build_pdf.py
      - name: Upload PDF books for review
        uses: actions/upload-artifact@v4
        with:
          name: zmod-pdf-books
          path: mkdocs/site/pdf/*.pdf
          if-no-files-found: error
      - name: Deploy site and PDF books to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: mkdocs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ghp-import -n -p -f -m "Deployed $(git rev-parse --short HEAD) with MkDocs version: $(python -c 'import mkdocs; print(mkdocs.__version__)')" site
