<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img"><title>Change in median residual by speed band</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#172033"><text x="500" y="30" font-size="22" text-anchor="middle" font-weight="bold">Change in median residual by speed band</text><text x="500" y="57" font-size="14" text-anchor="middle">Positive = larger residual with OpenCreator; negative = smaller residual</text><line x1="500" y1="83" x2="500" y2="345" stroke="#475569" stroke-width="2"/><text x="80" y="112" font-size="15" >20–50 mm/s</text><rect x="500" y="100" width="249.60000000000002" height="22" rx="3" fill="#245ca5"/><text x="759.6" y="115" font-size="12" text-anchor="start">X +41.6%</text><rect x="500" y="130" width="107.39999999999999" height="22" rx="3" fill="#157c62"/><text x="617.4" y="145" font-size="12" text-anchor="start">Y +17.9%</text><text x="80" y="195" font-size="15" >60–110 mm/s</text><rect x="315.2" y="183" width="184.8" height="22" rx="3" fill="#245ca5"/><text x="305.2" y="198" font-size="12" text-anchor="end">X -30.8%</text><rect x="458" y="213" width="42" height="22" rx="3" fill="#157c62"/><text x="448" y="228" font-size="12" text-anchor="end">Y -7.0%</text><text x="80" y="278" font-size="15" >120–220 mm/s</text><rect x="326.6" y="266" width="173.39999999999998" height="22" rx="3" fill="#245ca5"/><text x="316.6" y="281" font-size="12" text-anchor="end">X -28.9%</text><rect x="239.60000000000002" y="296" width="260.4" height="22" rx="3" fill="#157c62"/><text x="229.60000000000002" y="311" font-size="12" text-anchor="end">Y -43.4%</text><text x="500" y="353" font-size="12" text-anchor="middle" fill="#475569">Only matched harmonics ≤ 400 Hz; bands contain different harmonic sets.</text></g></svg>
