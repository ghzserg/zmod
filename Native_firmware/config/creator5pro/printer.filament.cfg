
[filament_switch_sensor fd_ex0]
switch_pin: !eheaterboard:PC13
pause_on_runout: False
event_delay: 1.0

[filament_motion_sensor fm_ex0]
switch_pin: !eheaterboard:PA15
detection_length: 50
extruder: extruder
event_delay: 3.0
pause_on_runout: False
runout_gcode:
     { action_respond_info("wheel runout:T0") }
insert_gcode:
     { action_respond_info("wheel insert:T0") }

